version: '3.8'

services:
  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: "ChangeMe!"
      MYSQL_DATABASE: "AllJobsDb"
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql

  backend:
    build:
      context: .
      dockerfile: AllJobsHomeAssignment.Server/Dockerfile
    depends_on:
      - db
    environment:
      ConnectionStrings__DefaultConnection: "server=db;port=3306;database=AllJobsDb;user=root;password=ChangeMe!"
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
    ports:
      - "8080:8080"

  frontend:
    build:
      context: ./alljobshomeassignment.client
      dockerfile: Dockerfile
    depends_on:
      - backend
    ports:
      - "3000:3000"

volumes:
  db_data:
