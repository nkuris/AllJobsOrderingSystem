server {
	listen       80;
	server_name  _;
	root   /usr/share/nginx/html;
	index  index.html;

	# Serve static files and pre-rendered pages. If a file is not found,
	# fall back to index.html so pre-rendered nested routes like /login
	# (which export to /login/index.html) are correctly served whether
	# the trailing slash is present or not.
	location / {
		try_files $uri $uri/ /index.html;
	}

	# Ensure Next.js generated assets are served directly
	location /_next/ {
		try_files $uri $uri/ =404;
	}

	location /static/ {
		try_files $uri $uri/ =404;
	}

	error_page  500 502 503 504  /50x.html;
	location = /50x.html {
		root   /usr/share/nginx/html;
	}
}
